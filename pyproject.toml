[project]
name = "koulis"
version = "0.2.0"
description = "Python SDK for the Koulis restaurant reservation infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Massimo Marcellin", email = "hello@koulis.app" }
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic[email]>=2.10.0",
]

[project.urls]
Homepage = "https://koulis.app"
Repository = "https://github.com/koulis-app/koulis.sdk_python"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "datamodel-code-generator>=0.26.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koulis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["examples/"]